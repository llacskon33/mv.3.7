
name: Crear maquina virtual Windows 11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maquina-virtual:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Preparar Linux y QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            curl \
            wget \
            unzip

      - name: Comprobar virtualizacion
        run: |
          echo "CPU:"
          lscpu | grep -i virtualization || true
          echo "KVM:"
          ls -l /dev/kvm || true

      - name: Crear disco virtual de 128 GB
        run: |
          mkdir -p "$HOME/vm"
          qemu-img create \
            -f qcow2 \
            "$HOME/vm/windows11.qcow2" \
            128G
          qemu-img info "$HOME/vm/windows11.qcow2"

      - name: Preparar firmware UEFI
        run: |
          mkdir -p "$HOME/vm/firmware"
          cp /usr/share/OVMF/OVMF_CODE_4M.fd \
            "$HOME/vm/firmware/OVMF_CODE.fd"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd \
            "$HOME/vm/firmware/OVMF_VARS.fd"

      - name: Iniciar TPM virtual
        run: |
          mkdir -p "$HOME/vm/tpm"
          swtpm socket \
            --tpmstate dir="$HOME/vm/tpm" \
            --ctrl type=tcp,port=2322 \
            --tpm2 \
            --daemon

      - name: Preparar Windows 11
        run: |
          echo "La máquina virtual está preparada."
          echo "Disco virtual: 128 GB"
          echo "Firmware: UEFI"
          echo "TPM: 2.0"

      - name: Mantener el trabajo activo
        run: |
          echo "La VM necesita una ISO de Windows 11"
          echo "y una configuración de red para arrancar."
          echo "Este trabajo no instala Windows automáticamente."
          sleep 60
          
