name: BlissOS

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL directa del ISO de BlissOS (x86_64)"
        type: string
        default: "https://sourceforge.net/projects/blissos-x86/files/Official/BlissOS16/Generic/Bliss-v16.9.7-x86_64-OFFICIAL-opengapps-20241218.iso/download"
      minutos:
        description: "Minutos activa antes de la copia final (máx. 315)"
        type: number
        default: 315
      intervalo:
        description: "Cada cuántos minutos guardar el disco"
        type: number
        default: 60
      disco_gb:
        description: "Tamaño del disco virtual (solo la primera vez)"
        type: number
        default: 16

permissions:
  contents: write

env:
  BACKUP_PREFIX: bliss-backup-
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  bliss:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar QEMU y activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils socat
          ls -l /dev/kvm || echo "::warning::Sin /dev/kvm: iría muy lento (solo repos públicos tienen KVM)."
          echo "JOB_START=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: bliss-${{ github.run_id }}

      - name: IP de Tailscale
        run: |
          IP=$(tailscale ip -4 | head -n1)
          if [ -z "$IP" ]; then echo "::error::Falta TS_AUTHKEY o Tailscale no conectó."; exit 1; fi
          echo "TS_IP=$IP" >> "$GITHUB_ENV"

      - name: Descargar ISO y restaurar disco
        run: |
          mkdir -p "$HOME/bliss" && cd "$HOME/bliss"
          curl -L --fail --retry 3 -o bliss.iso "${{ inputs.iso_url }}"
          ls -lh bliss.iso

          TAG=""
          for t in $(gh release list --limit 100 --json tagName,createdAt \
                     --jq "[.[]|select(.tagName|startswith(\"$BACKUP_PREFIX\"))]|sort_by(.createdAt)|reverse|.[].tagName"); do
            if gh release view "$t" --json assets --jq '.assets[].name' | grep -qx complete.flag; then TAG="$t"; break; fi
          done

          if [ -n "$TAG" ]; then
            echo "Restaurando copia $TAG"
            mkdir dl
            gh release download "$TAG" --dir dl
            cat dl/disk.qcow2.part* > disk.qcow2
            rm -rf dl
            echo "FIRST_RUN=0" >> "$GITHUB_ENV"
          else
            echo "Primera ejecución: disco nuevo."
            qemu-img create -f qcow2 disk.qcow2 "${{ inputs.disco_gb }}G"
            echo "FIRST_RUN=1" >> "$GITHUB_ENV"
          fi
          echo "RESTORE_OK=1" >> "$GITHUB_ENV"

      - name: Arrancar BlissOS
        run: |
          cd "$HOME/bliss"
          # Primera vez: arranca desde el ISO para instalarlo en el disco.
          # Después: arranca directamente del disco.
          if [ "$FIRST_RUN" = "1" ]; then BOOT="-boot d"; else BOOT="-boot c"; fi
          nohup qemu-system-x86_64 \
            -enable-kvm -cpu host -smp 4 -m 6G \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -cdrom bliss.iso $BOOT \
            -device virtio-vga-gl -display none \
            -vnc "$TS_IP":0 \
            -device virtio-tablet-pci -device virtio-keyboard-pci \
            -nic user,model=virtio-net-pci,hostfwd=tcp:$TS_IP:5555-:5555 \
            -monitor unix:/tmp/qemu-mon,server,nowait \
            > qemu.log 2>&1 &
          sleep 15
          pgrep -a qemu || { cat qemu.log; exit 1; }
          # Si virtio-vga-gl no está disponible, cae a VGA estándar
          if ! pgrep qemu >/dev/null; then echo "QEMU no arrancó"; cat qemu.log; exit 1; fi

      - name: Datos de conexión
        run: |
          {
            echo "## BlissOS"
            echo "- VNC: \`$TS_IP:5900\` (usa un cliente VNC o Moonlight/AVNC en el móvil, con Tailscale activo)"
            echo "- ADB: \`adb connect $TS_IP:5555\` (scrcpy funciona sobre esto)"
            if [ "$FIRST_RUN" = "1" ]; then
              echo "- **Primera vez**: en el menú de arranque elige *Installation*, crea una partición, formatea ext4, instala GRUB y *no* arranques aún; apaga y reinicia desde el disco (cierra la ejecución y vuelve a lanzarla, o espera a la siguiente copia)."
            fi
            echo "- Se termina solo al llegar al plazo."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sesión con copias periódicas
        env:
          MINUTOS: ${{ inputs.minutos }}
          INTERVALO: ${{ inputs.intervalo }}
        run: |
          cd "$HOME/bliss"
          MIN=$(( MINUTOS > 315 ? 315 : (MINUTOS < 1 ? 1 : MINUTOS) ))
          INT=$(( INTERVALO < 1 ? 1 : INTERVALO ))
          NOW=$(date +%s)
          DEADLINE=$(( NOW + MIN*60 ))
          LIMIT=$(( JOB_START + 350*60 ))
          [ $DEADLINE -gt $LIMIT ] && DEADLINE=$LIMIT

          backup() {
            echo "$(date +%T) Copia de seguridad..."
            echo stop | socat - UNIX-CONNECT:/tmp/qemu-mon >/dev/null 2>&1
            sleep 2
            rm -rf out && mkdir out
            qemu-img convert -O qcow2 -c disk.qcow2 out/disk.compact.qcow2 || { echo cont | socat - UNIX-CONNECT:/tmp/qemu-mon >/dev/null; return 1; }
            echo cont | socat - UNIX-CONNECT:/tmp/qemu-mon >/dev/null 2>&1
            split -b 1900M -d out/disk.compact.qcow2 out/disk.qcow2.part
            rm out/disk.compact.qcow2
            TAG="${BACKUP_PREFIX}$(date +%Y%m%d-%H%M%S)"
            gh release create "$TAG" --title "$TAG" --notes "Copia automática de BlissOS" --latest=false || return 1
            if ! gh release upload "$TAG" out/disk.qcow2.part* --clobber; then
              gh release delete "$TAG" --yes --cleanup-tag; return 1
            fi
            echo ok > out/complete.flag
            gh release upload "$TAG" out/complete.flag || { gh release delete "$TAG" --yes --cleanup-tag; return 1; }
            for o in $(gh release list --limit 100 --json tagName --jq ".[].tagName" | grep "^$BACKUP_PREFIX" | grep -vx "$TAG"); do
              gh release delete "$o" --yes --cleanup-tag
            done
            rm -rf out
            echo "Copia guardada: $TAG"
          }

          LAST=$NOW
          while [ "$(date +%s)" -lt $DEADLINE ]; do
            sleep 60
            pgrep qemu >/dev/null || { echo "QEMU se cerró (apagado desde Android)."; break; }
            if [ $(( $(date +%s) - LAST )) -ge $(( INT*60 )) ] && [ "$(date +%s)" -lt $DEADLINE ]; then
              backup || echo "::warning::La copia periódica falló; se conserva la anterior."
              LAST=$(date +%s)
            fi
          done

          echo "== Copia final =="
          pgrep qemu >/dev/null && { echo system_powerdown | socat - UNIX-CONNECT:/tmp/qemu-mon >/dev/null 2>&1; sleep 20; }
          backup || { echo "::error::La copia final falló; se conserva la anterior."; exit 1; }
