name: RDP

on:
  workflow_dispatch:
    inputs:
      inventario:
        description: "Listar apps instaladas y carpetas pesadas al inicio"
        type: boolean
        default: false
      sunshine:
        description: "Instalar Sunshine (streaming para conectar con Moonlight desde el móvil)"
        type: boolean
        default: true
      minutos:
        description: "Minutos activa antes de la copia final (máx. 315)"
        type: number
        default: 315
      intervalo:
        description: "Cada cuántos minutos hacer copia de seguridad"
        type: number
        default: 30
      conservar:
        description: "Cuántas copias completas conservar en Releases (mínimo 1)"
        type: number
        default: 2
      liberar:
        description: "Liberar espacio en segundo plano (borra Visual Studio, Android, bases de datos, etc. del runner)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  BACKUP_PREFIX: rdp-backup-
  GH_REPO: ${{ github.repository }}
  # Lista FIJA de apps que se reinstalan (ids de Chocolatey, separados por comas).
  # Ignora lo guardado en copias anteriores. Para añadir/quitar apps, edita esta línea.
  APPS_FIJAS: "epicgameslauncher,steam-client"

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: List installed apps
        if: ${{ inputs.inventario }}
        shell: pwsh
        run: |
          $out = $env:GITHUB_STEP_SUMMARY

          "## Espacio libre" | Out-File $out -Append -Encoding utf8
          Get-PSDrive -Name C,D -ErrorAction SilentlyContinue | ForEach-Object {
              "- $($_.Name): $([math]::Round($_.Free/1GB,1)) GB libres" |
                Out-File $out -Append -Encoding utf8
          }

          $paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                   'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                   'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $apps = Get-ItemProperty $paths -ErrorAction SilentlyContinue |
                  Where-Object DisplayName |
                  Select-Object @{n='Nombre';e={$_.DisplayName}},
                                @{n='MB';e={[math]::Round($_.EstimatedSize/1024)}},
                                @{n='Ruta';e={$_.InstallLocation}} |
                  Sort-Object Nombre -Unique |
                  Sort-Object MB -Descending

          "`n## Apps instaladas ($($apps.Count))" | Out-File $out -Append -Encoding utf8
          "| Nombre | MB | Ruta |" | Out-File $out -Append -Encoding utf8
          "|---|---|---|" | Out-File $out -Append -Encoding utf8
          $apps | ForEach-Object {
              "| $($_.Nombre) | $($_.MB) | $($_.Ruta) |" | Out-File $out -Append -Encoding utf8
          }

          Write-Host "`n===== 40 APPS MÁS GRANDES (MB) ====="
          $apps | Select-Object -First 40 | Format-Table -AutoSize | Out-String -Width 250 | Write-Host

          $roots = 'C:\', 'C:\Program Files', 'C:\Program Files (x86)', 'C:\ProgramData'
          $folders = foreach ($r in $roots) {
              Get-ChildItem $r -Directory -Force -ErrorAction SilentlyContinue |
              ForEach-Object -Parallel {
                  $s = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue |
                        Measure-Object Length -Sum).Sum
                  [pscustomobject]@{ Carpeta = $_.FullName; GB = [math]::Round($s/1GB,2) }
              } -ThrottleLimit 8
          }
          $top = $folders | Sort-Object GB -Descending | Select-Object -First 40

          "`n## Carpetas más pesadas" | Out-File $out -Append -Encoding utf8
          "| Carpeta | GB |" | Out-File $out -Append -Encoding utf8
          "|---|---|" | Out-File $out -Append -Encoding utf8
          $top | ForEach-Object {
              "| $($_.Carpeta) | $($_.GB) |" | Out-File $out -Append -Encoding utf8
          }

          Write-Host "`n===== 25 CARPETAS MÁS PESADAS (GB) ====="
          $top | Select-Object -First 25 | Format-Table -AutoSize | Out-String -Width 250 | Write-Host

      - name: Prepare data folders
        shell: pwsh
        run: |
          "JOB_START=$((Get-Date).ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          function Show-Free {
              Get-PSDrive -Name C,D -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host ("{0}: libre {1} GB" -f $_.Name, [math]::Round($_.Free/1GB,1))
              }
          }
          Write-Host "== Antes =="; Show-Free

          if (Test-Path "D:\") {
              New-Item -ItemType Directory -Path "D:\Datos" -Force | Out-Null
              if (-not (Test-Path "C:\Datos")) {
                  cmd /c mklink /J "C:\Datos" "D:\Datos" | Out-Null
              }
          }
          New-Item -ItemType Directory -Path "C:\Datos" -Force | Out-Null

          Write-Host "== Después =="; Show-Free
          $global:LASTEXITCODE = 0

      - name: Create backup script
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference = "Continue"
          $7z = "C:\Program Files\7-Zip\7z.exe"
          $prefix = $env:BACKUP_PREFIX
          if ([string]::IsNullOrWhiteSpace($env:BACKUP_PASSPHRASE)) {
              Write-Host "::error::Define el secreto BACKUP_PASSPHRASE para cifrar las copias; no se subirá ningún archivo sin cifrar."
              exit 1
          }
          $keep = 2
          [void][int]::TryParse("$env:KEEP", [ref]$keep)
          if ($keep -lt 1) { $keep = 1 }

          if (-not (Test-Path "C:\restore-ok.flag")) {
              Write-Host "[backup] La restauración no terminó bien: no se guarda nada para no pisar la copia anterior."
              exit 0
          }

          $skip = @('Datos','System Volume Information','$RECYCLE.BIN','_rdp_dl','_rdp_backup')
          $roots = @("C:\Datos","C:\Users\RDP")
          if (Test-Path "D:\") {
              $roots += Get-ChildItem "D:\" -Directory -Force -ErrorAction SilentlyContinue -WarningAction SilentlyContinue |
                        Where-Object { $_.Name -notin $skip } | ForEach-Object FullName
          }
          $lines = foreach ($r in $roots) {
              if (Test-Path $r) {
                  Get-ChildItem $r -Recurse -File -Force -ErrorAction SilentlyContinue -WarningAction SilentlyContinue |
                    Where-Object { $_.FullName -notmatch '\\\.apps\\|\\\.programas\\|\\Temp\\|\\INetCache\\|parar\.txt' } |
                    ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }
              }
          }
          $lines += Get-ChildItem "C:\Program Files","C:\Program Files (x86)","C:\ProgramData\chocolatey\lib" -Directory -Name -ErrorAction SilentlyContinue
          # Apps registradas (instaladores .exe/.msi que no crean carpeta nueva) y servicios también cuentan como cambio
          $uninstPaths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                         'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $lines += @(Get-ItemProperty $uninstPaths -ErrorAction SilentlyContinue | Where-Object DisplayName | ForEach-Object { "app|$($_.DisplayName)|$($_.DisplayVersion)" })
          $lines += @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | ForEach-Object { "svc|$($_.Name)" })
          # Sunshine: si cambia el estado (nuevos móviles emparejados), cuenta como cambio
          $sunState = "C:\Program Files\Sunshine\config\sunshine_state.json"
          if (Test-Path $sunState) { $lines += "sunshine|" + (Get-FileHash $sunState -Algorithm SHA256).Hash }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $sig = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes(($lines -join "`n"))))
          if ((Test-Path "C:\last-sig.txt") -and ((Get-Content "C:\last-sig.txt" -Raw).Trim() -eq $sig)) {
              Write-Host "[backup] Sin cambios desde la última copia."
              exit 0
          }
          Write-Host "[backup] Hay cambios: preparando copia..."

          $appsDir = "C:\Datos\.apps"
          $prog = "C:\Datos\.programas"
          New-Item -ItemType Directory -Path $appsDir -Force | Out-Null
          New-Item -ItemType Directory -Path $prog -Force | Out-Null
          Remove-Item "C:\Datos\parar.txt" -Force -ErrorAction SilentlyContinue
          $cap = 3GB

          function Copy-Capped($src, $dst) {
              $size = (Get-ChildItem $src -Recurse -File -Force -ErrorAction SilentlyContinue |
                       Measure-Object Length -Sum).Sum
              if ($size -gt $cap) { Write-Host "[backup] Omitido (más de 3 GB): $src"; return }
              robocopy $src $dst /E /R:0 /W:0 /NFL /NDL /NJH /NJS | Out-Null
              $global:LASTEXITCODE = 0
          }
          function Save-New($srcRoot, $baseFile, $dstRoot, $exclude = @()) {
              if (-not (Test-Path $baseFile)) { return }
              Remove-Item $dstRoot -Recurse -Force -ErrorAction SilentlyContinue
              $base = @(Get-Content $baseFile)
              Get-ChildItem $srcRoot -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notin $base -and $_.Name -ne 'Tailscale' -and $_.Name -ne 'Sunshine' -and $_.Name -notin $exclude } |
                ForEach-Object { Copy-Capped $_.FullName (Join-Path $dstRoot $_.Name) }
          }

          # Exporta una rama del registro del usuario RDP (HKCU\<sub>), esté o no conectado.
          # Por defecto exporta HKCU\Software; también se usa para "Control Panel\Desktop"
          # (imagen de fondo y ajustes de pantalla) y "Control Panel\Colors".
          function Save-RdpRegistry($dstDir, $sub = "Software", $name = "rdp-software.reg") {
              $u = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
              if (-not $u) { return }
              $sid = $u.SID.Value
              $tmp = Join-Path $env:TEMP $name
              Remove-Item $tmp -Force -ErrorAction SilentlyContinue
              $key = "HKU\$sid\$sub"
              $prefixReg = "HKEY_USERS\$sid"
              $mounted = $false
              if (-not (Test-Path "Registry::HKEY_USERS\$sid")) {
                  $nt = "C:\Users\RDP\NTUSER.DAT"
                  if (Test-Path $nt) {
                      reg load HKU\RDP_TMP $nt 2>$null | Out-Null
                      if ($LASTEXITCODE -eq 0) { $mounted = $true; $key = "HKU\RDP_TMP\$sub"; $prefixReg = "HKEY_USERS\RDP_TMP" }
                  }
              }
              reg export $key $tmp /y 2>$null | Out-Null
              if ($mounted) { [gc]::Collect(); Start-Sleep 1; reg unload HKU\RDP_TMP 2>$null | Out-Null }
              if (Test-Path $tmp) {
                  # Normaliza el nombre de la clave para poder importarla en cualquier sesión futura
                  $txt = [IO.File]::ReadAllText($tmp, [Text.Encoding]::Unicode)
                  $txt = $txt.Replace($prefixReg, "HKEY_USERS\RDP_RESTORE")
                  New-Item -ItemType Directory -Path $dstDir -Force | Out-Null
                  [IO.File]::WriteAllText((Join-Path $dstDir $name), $txt, [Text.Encoding]::Unicode)
                  Remove-Item $tmp -Force -ErrorAction SilentlyContinue
                  Write-Host "[backup] Guardado del registro del usuario RDP: $sub"
              } else {
                  Write-Host "[backup] No se pudo exportar del usuario RDP: $sub"
              }
              $global:LASTEXITCODE = 0
          }

          # Sube archivos con reintentos. Devuelve $true solo si todos subieron.
          function Upload-Retry($tag, $paths) {
              foreach ($p in $paths) {
                  $ok = $false
                  for ($i = 1; $i -le 3 -and -not $ok; $i++) {
                      gh release upload $tag $p --clobber 2>&1 | Out-Host
                      if ($LASTEXITCODE -eq 0) { $ok = $true }
                      else { Write-Host "[backup] Reintento $i de $(Split-Path $p -Leaf)"; Start-Sleep 15 }
                  }
                  if (-not $ok) { return $false }
              }
              return $true
          }

          Save-New "C:\Program Files" "C:\baseline-pf.txt" "$prog\PF"
          Save-New "C:\Program Files (x86)" "C:\baseline-pf86.txt" "$prog\PF86"
          Save-New "C:\ProgramData" "C:\baseline-pd.txt" "$prog\PD" @('Package Cache','regid.1991-06.com.microsoft','SoftwareDistribution','USOPrivate','USOShared','Microsoft')

