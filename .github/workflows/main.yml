name: RDP

on:
  workflow_dispatch:
    inputs:
      inventario:
        description: "Listar apps instaladas y carpetas pesadas al inicio"
        type: boolean
        default: false
      sunshine:
        description: "Instalar Sunshine (streaming para conectar con Moonlight desde el móvil)"
        type: boolean
        default: true
      minutos:
        description: "Minutos activa antes de la copia final (máx. 315)"
        type: number
        default: 315
      intervalo:
        description: "Cada cuántos minutos hacer copia de seguridad"
        type: number
        default: 30
      conservar:
        description: "Cuántas copias completas conservar en Releases (mínimo 1)"
        type: number
        default: 2
      liberar:
        description: "Liberar espacio en segundo plano (borra Visual Studio, Android, bases de datos, etc. del runner)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  BACKUP_PREFIX: rdp-backup-
  GH_REPO: ${{ github.repository }}
  # Lista FIJA de apps que se reinstalan (ids de Chocolatey, separados por comas).
  # Ignora lo guardado en copias anteriores. Para añadir/quitar apps, edita esta línea.
  APPS_FIJAS: "epicgameslauncher,steam-client"

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: List installed apps
        if: ${{ inputs.inventario }}
        shell: pwsh
        run: |
          $out = $env:GITHUB_STEP_SUMMARY

          "## Espacio libre" | Out-File $out -Append -Encoding utf8
          Get-PSDrive -Name C,D -ErrorAction SilentlyContinue | ForEach-Object {
              "- $($_.Name): $([math]::Round($_.Free/1GB,1)) GB libres" |
                Out-File $out -Append -Encoding utf8
          }

          $paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                   'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                   'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $apps = Get-ItemProperty $paths -ErrorAction SilentlyContinue |
                  Where-Object DisplayName |
                  Select-Object @{n='Nombre';e={$_.DisplayName}},
                                @{n='MB';e={[math]::Round($_.EstimatedSize/1024)}},
                                @{n='Ruta';e={$_.InstallLocation}} |
                  Sort-Object Nombre -Unique |
                  Sort-Object MB -Descending

          "`n## Apps instaladas ($($apps.Count))" | Out-File $out -Append -Encoding utf8
          "| Nombre | MB | Ruta |" | Out-File $out -Append -Encoding utf8
          "|---|---|---|" | Out-File $out -Append -Encoding utf8
          $apps | ForEach-Object {
              "| $($_.Nombre) | $($_.MB) | $($_.Ruta) |" | Out-File $out -Append -Encoding utf8
          }

          Write-Host "`n===== 40 APPS MÁS GRANDES (MB) ====="
          $apps | Select-Object -First 40 | Format-Table -AutoSize | Out-String -Width 250 | Write-Host

          $roots = 'C:\', 'C:\Program Files', 'C:\Program Files (x86)', 'C:\ProgramData'
          $folders = foreach ($r in $roots) {
              Get-ChildItem $r -Directory -Force -ErrorAction SilentlyContinue |
              ForEach-Object -Parallel {
                  $s = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue |
                        Measure-Object Length -Sum).Sum
                  [pscustomobject]@{ Carpeta = $_.FullName; GB = [math]::Round($s/1GB,2) }
              } -ThrottleLimit 8
          }
          $top = $folders | Sort-Object GB -Descending | Select-Object -First 40

          "`n## Carpetas más pesadas" | Out-File $out -Append -Encoding utf8
          "| Carpeta | GB |" | Out-File $out -Append -Encoding utf8
          "|---|---|" | Out-File $out -Append -Encoding utf8
          $top | ForEach-Object {
              "| $($_.Carpeta) | $($_.GB) |" | Out-File $out -Append -Encoding utf8
          }

          Write-Host "`n===== 25 CARPETAS MÁS PESADAS (GB) ====="
          $top | Select-Object -First 25 | Format-Table -AutoSize | Out-String -Width 250 | Write-Host

      - name: Prepare data folders
        shell: pwsh
        run: |
          "JOB_START=$((Get-Date).ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          function Show-Free {
              Get-PSDrive -Name C,D -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host ("{0}: libre {1} GB" -f $_.Name, [math]::Round($_.Free/1GB,1))
              }
          }
          Write-Host "== Antes =="; Show-Free

          if (Test-Path "D:\") {
              New-Item -ItemType Directory -Path "D:\Datos" -Force | Out-Null
              if (-not (Test-Path "C:\Datos")) {
                  cmd /c mklink /J "C:\Datos" "D:\Datos" | Out-Null
              }
          }
          New-Item -ItemType Directory -Path "C:\Datos" -Force | Out-Null

          Write-Host "== Después =="; Show-Free
          $global:LASTEXITCODE = 0

      - name: Create backup script
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference = "Continue"
          $7z = "C:\Program Files\7-Zip\7z.exe"
          $prefix = $env:BACKUP_PREFIX
          if ([string]::IsNullOrWhiteSpace($env:BACKUP_PASSPHRASE)) {
              Write-Host "::error::Define el secreto BACKUP_PASSPHRASE para cifrar las copias; no se subirá ningún archivo sin cifrar."
              exit 1
          }
          $keep = 2
          [void][int]::TryParse("$env:KEEP", [ref]$keep)
          if ($keep -lt 1) { $keep = 1 }

          if (-not (Test-Path "C:\restore-ok.flag")) {
              Write-Host "[backup] La restauración no terminó bien: no se guarda nada para no pisar la copia anterior."
              exit 0
          }

          $skip = @('Datos','System Volume Information','$RECYCLE.BIN','_rdp_dl','_rdp_backup')
          $roots = @("C:\Datos","C:\Users\RDP")
          if (Test-Path "D:\") {
              $roots += Get-ChildItem "D:\" -Directory -Force -ErrorAction SilentlyContinue -WarningAction SilentlyContinue |
                        Where-Object { $_.Name -notin $skip } | ForEach-Object FullName
          }
          $lines = foreach ($r in $roots) {
              if (Test-Path $r) {
                  Get-ChildItem $r -Recurse -File -Force -ErrorAction SilentlyContinue -WarningAction SilentlyContinue |
                    Where-Object { $_.FullName -notmatch '\\\.apps\\|\\\.programas\\|\\Temp\\|\\INetCache\\|parar\.txt' } |
                    ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }
              }
          }
          $lines += Get-ChildItem "C:\Program Files","C:\Program Files (x86)","C:\ProgramData\chocolatey\lib" -Directory -Name -ErrorAction SilentlyContinue
          # Apps registradas (instaladores .exe/.msi que no crean carpeta nueva) y servicios también cuentan como cambio
          $uninstPaths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                         'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $lines += @(Get-ItemProperty $uninstPaths -ErrorAction SilentlyContinue | Where-Object DisplayName | ForEach-Object { "app|$($_.DisplayName)|$($_.DisplayVersion)" })
          $lines += @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | ForEach-Object { "svc|$($_.Name)" })
          # Sunshine: si cambia el estado (nuevos móviles emparejados), cuenta como cambio
          $sunState = "C:\Program Files\Sunshine\config\sunshine_state.json"
          if (Test-Path $sunState) { $lines += "sunshine|" + (Get-FileHash $sunState -Algorithm SHA256).Hash }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $sig = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes(($lines -join "`n"))))
          if ((Test-Path "C:\last-sig.txt") -and ((Get-Content "C:\last-sig.txt" -Raw).Trim() -eq $sig)) {
              Write-Host "[backup] Sin cambios desde la última copia."
              exit 0
          }
          Write-Host "[backup] Hay cambios: preparando copia..."

          $appsDir = "C:\Datos\.apps"
          $prog = "C:\Datos\.programas"
          New-Item -ItemType Directory -Path $appsDir -Force | Out-Null
          New-Item -ItemType Directory -Path $prog -Force | Out-Null
          Remove-Item "C:\Datos\parar.txt" -Force -ErrorAction SilentlyContinue
          $cap = 3GB

          function Copy-Capped($src, $dst) {
              $size = (Get-ChildItem $src -Recurse -File -Force -ErrorAction SilentlyContinue |
                       Measure-Object Length -Sum).Sum
              if ($size -gt $cap) { Write-Host "[backup] Omitido (más de 3 GB): $src"; return }
              robocopy $src $dst /E /R:0 /W:0 /NFL /NDL /NJH /NJS | Out-Null
              $global:LASTEXITCODE = 0
          }
          function Save-New($srcRoot, $baseFile, $dstRoot, $exclude = @()) {
              if (-not (Test-Path $baseFile)) { return }
              Remove-Item $dstRoot -Recurse -Force -ErrorAction SilentlyContinue
              $base = @(Get-Content $baseFile)
              Get-ChildItem $srcRoot -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notin $base -and $_.Name -ne 'Tailscale' -and $_.Name -ne 'Sunshine' -and $_.Name -notin $exclude } |
                ForEach-Object { Copy-Capped $_.FullName (Join-Path $dstRoot $_.Name) }
          }

          # Exporta una rama del registro del usuario RDP (HKCU\<sub>), esté o no conectado.
          # Por defecto exporta HKCU\Software; también se usa para "Control Panel\Desktop"
          # (imagen de fondo y ajustes de pantalla) y "Control Panel\Colors".
          function Save-RdpRegistry($dstDir, $sub = "Software", $name = "rdp-software.reg") {
              $u = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
              if (-not $u) { return }
              $sid = $u.SID.Value
              $tmp = Join-Path $env:TEMP $name
              Remove-Item $tmp -Force -ErrorAction SilentlyContinue
              $key = "HKU\$sid\$sub"
              $prefixReg = "HKEY_USERS\$sid"
              $mounted = $false
              if (-not (Test-Path "Registry::HKEY_USERS\$sid")) {
                  $nt = "C:\Users\RDP\NTUSER.DAT"
                  if (Test-Path $nt) {
                      reg load HKU\RDP_TMP $nt 2>$null | Out-Null
                      if ($LASTEXITCODE -eq 0) { $mounted = $true; $key = "HKU\RDP_TMP\$sub"; $prefixReg = "HKEY_USERS\RDP_TMP" }
                  }
              }
              reg export $key $tmp /y 2>$null | Out-Null
              if ($mounted) { [gc]::Collect(); Start-Sleep 1; reg unload HKU\RDP_TMP 2>$null | Out-Null }
              if (Test-Path $tmp) {
                  # Normaliza el nombre de la clave para poder importarla en cualquier sesión futura
                  $txt = [IO.File]::ReadAllText($tmp, [Text.Encoding]::Unicode)
                  $txt = $txt.Replace($prefixReg, "HKEY_USERS\RDP_RESTORE")
                  New-Item -ItemType Directory -Path $dstDir -Force | Out-Null
                  [IO.File]::WriteAllText((Join-Path $dstDir $name), $txt, [Text.Encoding]::Unicode)
                  Remove-Item $tmp -Force -ErrorAction SilentlyContinue
                  Write-Host "[backup] Guardado del registro del usuario RDP: $sub"
              } else {
                  Write-Host "[backup] No se pudo exportar del usuario RDP: $sub"
              }
              $global:LASTEXITCODE = 0
          }

          # Sube archivos con reintentos. Devuelve $true solo si todos subieron.
          function Upload-Retry($tag, $paths) {
              foreach ($p in $paths) {
                  $ok = $false
                  for ($i = 1; $i -le 3 -and -not $ok; $i++) {
                      gh release upload $tag $p --clobber 2>&1 | Out-Host
                      if ($LASTEXITCODE -eq 0) { $ok = $true }
                      else { Write-Host "[backup] Reintento $i de $(Split-Path $p -Leaf)"; Start-Sleep 15 }
                  }
                  if (-not $ok) { return $false }
              }
              return $true
          }

          Save-New "C:\Program Files" "C:\baseline-pf.txt" "$prog\PF"
          Save-New "C:\Program Files (x86)" "C:\baseline-pf86.txt" "$prog\PF86"
          Save-New "C:\ProgramData" "C:\baseline-pd.txt" "$prog\PD" @('Package Cache','regid.1991-06.com.microsoft','SoftwareDistribution','USOPrivate','USOShared','Microsoft')

          $lp = "C:\Users\RDP\AppData\Local\Programs"
          if (Test-Path $lp) {
              Remove-Item "$prog\Local" -Recurse -Force -ErrorAction SilentlyContinue
              Get-ChildItem $lp -Directory | ForEach-Object {
                  Copy-Capped $_.FullName "$prog\Local\$($_.Name)"
              }
          }

          if (Test-Path "C:\baseline-choco.txt") {
              $base = @(Get-Content "C:\baseline-choco.txt")
              $now = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Directory -ErrorAction SilentlyContinue -WarningAction SilentlyContinue | ForEach-Object Name
              # La lista se ACUMULA: un paquete que falle al reinstalarse una vez no se pierde para siempre.
              # (Para quitar uno a propósito, edita C:\Datos\.apps\choco-packages.txt.)
              # Ahora la lista es fija (APPS_FIJAS): no se acumulan paquetes.
              @($env:APPS_FIJAS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }) |
                Sort-Object -Unique | Set-Content "$appsDir\choco-packages.txt"
          }
          Remove-Item "$appsDir\winget-packages.json" -Force -ErrorAction SilentlyContinue

          # --- Claves "Uninstall" y de fabricante en HKLM de las apps nuevas: así Windows las ve como instaladas ---
          $hklmDir = "$appsDir\hklm"
          Remove-Item $hklmDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $hklmDir -Force | Out-Null
          if (Test-Path "C:\baseline-registry.txt") {
              $baseReg2 = @(Get-Content "C:\baseline-registry.txt")
              $n = 0
              foreach ($rp in @('HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall')) {
                  foreach ($k in Get-ChildItem $rp -ErrorAction SilentlyContinue) {
                      $dn = (Get-ItemProperty -LiteralPath $k.PSPath -ErrorAction SilentlyContinue).DisplayName
                      if (-not $dn -or $dn -in $baseReg2 -or $dn -match 'Tailscale|Sunshine') { continue }
                      $n++
                      reg export "$($k.Name)" "$hklmDir\uninstall-$n.reg" /y 2>$null | Out-Null
                  }
              }
              foreach ($d in @(Get-ChildItem "$prog\PF","$prog\PF86" -Directory -ErrorAction SilentlyContinue)) {
                  foreach ($root in @('SOFTWARE','SOFTWARE\WOW6432Node')) {
                      if (Test-Path -LiteralPath "Registry::HKEY_LOCAL_MACHINE\$root\$($d.Name)") {
                          $n++
                          reg export "HKLM\$root\$($d.Name)" "$hklmDir\vendor-$n.reg" /y 2>$null | Out-Null
                      }
                  }
              }
              Write-Host "[backup] Claves de registro de apps guardadas: $n"
              $global:LASTEXITCODE = 0
          }

          # --- Servicios nuevos de apps (se recrean al restaurar) ---
          if (Test-Path "C:\baseline-services.txt") {
              $baseSvc = @(Get-Content "C:\baseline-services.txt")
              $svcs = @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -notin $baseSvc -and $_.PathName -and $_.PathName -notmatch '(?i)\\Windows\\|tailscale|sunshine' } |
                  ForEach-Object { [pscustomobject]@{ Name = $_.Name; DisplayName = $_.DisplayName; PathName = $_.PathName; StartMode = $_.StartMode; StartName = $_.StartName } })
              ConvertTo-Json -InputObject @($svcs) -Depth 3 | Set-Content "$appsDir\services.json" -Encoding utf8
              Write-Host "[backup] Servicios de apps guardados: $($svcs.Count)"
          }

          # --- Accesos directos (menú Inicio común y escritorio público) ---
          $smRoot = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs"
          $smDst = "$appsDir\startmenu"
          Remove-Item $smDst -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path "C:\baseline-startmenu.txt") {
              $baseSm = @(Get-Content "C:\baseline-startmenu.txt")
              Get-ChildItem $smRoot -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
                  $rel = $_.FullName.Substring($smRoot.Length).TrimStart('\')
                  if ($rel -notin $baseSm -and $rel -notmatch 'Tailscale|Sunshine') {
                      $t = Join-Path $smDst $rel
                      New-Item -ItemType Directory -Path (Split-Path $t) -Force | Out-Null
                      Copy-Item -LiteralPath $_.FullName -Destination $t -Force
                  }
              }
          }
          $pdDst = "$appsDir\publicdesktop"
          Remove-Item $pdDst -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path "C:\Users\Public\Desktop") {
              New-Item -ItemType Directory -Path $pdDst -Force | Out-Null
              Get-ChildItem "C:\Users\Public\Desktop" -File -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Extension -in '.lnk','.url' -and $_.Name -notmatch 'Tailscale|Sunshine' } |
                ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $pdDst -Force }
          }

          # --- Entradas nuevas del PATH del sistema ---
          if (Test-Path "C:\baseline-path.txt") {
              $basePath = @(Get-Content "C:\baseline-path.txt")
              $nowPath = @([Environment]::GetEnvironmentVariable('Path','Machine') -split ';' | Where-Object { $_ })
              @($nowPath | Where-Object { $_ -notin $basePath -and $_ -notmatch 'Tailscale|Sunshine' }) | Sort-Object -Unique |
                Set-Content "$appsDir\path-extra.txt"
          }
          if (Test-Path "C:\baseline-registry.txt") {
              $baseReg = @(Get-Content "C:\baseline-registry.txt")
              $paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                       'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                       'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
              $nowReg = Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object DisplayName | ForEach-Object DisplayName
              $prev = @()
              if (Test-Path "$appsDir\programas-instalados.txt") { $prev = @(Get-Content "$appsDir\programas-instalados.txt") }
              @(@($nowReg | Where-Object { $_ -notin $baseReg }) + $prev) | Where-Object { $_ } | Sort-Object -Unique |
                Set-Content "$appsDir\programas-instalados.txt"
          }

          # Guardar configuración del usuario RDP (programas, imagen de fondo y colores) y lista de paquetes winget
          Save-RdpRegistry "$appsDir\registry"
          Save-RdpRegistry "$appsDir\registry" "Control Panel\Desktop" "rdp-desktop.reg"
          Save-RdpRegistry "$appsDir\registry" "Control Panel\Colors"  "rdp-colors.reg"
          # SID del usuario RDP: al restaurar se compara para saber si las sesiones cifradas (DPAPI) pueden funcionar
          $uSid = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          if ($uSid) {
              New-Item -ItemType Directory -Path "$appsDir\registry" -Force | Out-Null
              $uSid.SID.Value | Set-Content "$appsDir\registry\rdp-sid.txt"
          }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
              $wgFull = Join-Path $env:TEMP "winget-full.json"
              Remove-Item $wgFull -Force -ErrorAction SilentlyContinue
              winget export -o $wgFull --include-versions --accept-source-agreements 2>&1 | Out-Host
              $global:LASTEXITCODE = 0
              if (Test-Path $wgFull) {
                  # Se guardan SOLO los paquetes que no estaban en el runner (línea base de winget)
                  $wgBase = @()
                  if (Test-Path "C:\baseline-winget.txt") { $wgBase = @(Get-Content "C:\baseline-winget.txt" | Where-Object { $_ }) }
                  $wgOut = "$appsDir\winget-packages.json"
                  if ($wgBase.Count -eq 0) {
                      Write-Host "[backup] Sin línea base de winget: no se guarda la lista de winget (evita reinstalar apps del runner)."
                  } else {
                      $wg = Get-Content $wgFull -Raw | ConvertFrom-Json
                      $nNew = 0
                      foreach ($src in @($wg.Sources)) {
                          $src.Packages = @($src.Packages | Where-Object { $_.PackageIdentifier -notin $wgBase })
                          $nNew += $src.Packages.Count
                      }
                      $wg.Sources = @($wg.Sources | Where-Object { $_.Packages.Count -gt 0 })
                      $wg | ConvertTo-Json -Depth 8 | Set-Content $wgOut -Encoding utf8
                      Write-Host "[backup] winget: $nNew paquetes nuevos guardados (los del runner se omiten)."
                  }
              }
              Remove-Item $wgFull -Force -ErrorAction SilentlyContinue
              $global:LASTEXITCODE = 0
          } else {
              Write-Host "[backup] winget no está disponible en este runner: no se guarda lista de winget (usa choco para que se reinstalen)."
          }

          # Guardar configuración de Sunshine (móviles emparejados, claves, ajustes)
          $sunCfg = "C:\Program Files\Sunshine\config"
          if (Test-Path $sunCfg) {
              robocopy $sunCfg "$appsDir\sunshine-config" /E /XF "*.log" /R:0 /W:0 /NFL /NDL /NJH /NJS | Out-Null
              $global:LASTEXITCODE = 0
          }

          $dst = "D:\_rdp_backup"
          if (-not (Test-Path "D:\")) { $dst = "C:\_rdp_backup" }
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $datosPath = if (Test-Path "D:\Datos") { "D:\Datos" } else { "C:\Datos" }
          $bad = $false

          & $7z a -t7z -mx=1 -v1900m -ssw "-p$env:BACKUP_PASSPHRASE" -mhe=on "$dst\datos.7z" $datosPath | Out-Null
          if ($LASTEXITCODE -ge 2) { $bad = $true }

          if (Test-Path "C:\Users\RDP") {
              & $7z a -t7z -mx=1 -v1900m -ssw "-p$env:BACKUP_PASSPHRASE" -mhe=on "$dst\profile.7z" "C:\Users\RDP" `
                  "-xr!NTUSER.DAT*" "-xr!UsrClass.dat*" "-xr!Temp" "-xr!INetCache" `
                  "-xr!Cache" "-xr!Code Cache" "-xr!GPUCache" "-xr!CacheStorage" "-xr!Crashpad" `
                  "-x!RDP\AppData\Local\Programs" | Out-Null
              if ($LASTEXITCODE -ge 2) { $bad = $true }
          }

          if (Test-Path "D:\") {
              $extra = Get-ChildItem "D:\" -Directory -Force -ErrorAction SilentlyContinue -WarningAction SilentlyContinue |
                       Where-Object { $_.Name -notin $skip } | ForEach-Object FullName
              if ($extra) {
                  & $7z a -t7z -mx=1 -v1900m -ssw "-p$env:BACKUP_PASSPHRASE" -mhe=on "$dst\dextra.7z" @extra | Out-Null
                  if ($LASTEXITCODE -ge 2) { $bad = $true }
              }
          }
          if ($bad) {
              Write-Host "[backup] Error al comprimir: se conserva la copia anterior."
              Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
              exit 1
          }

          # Estado práctico: URLs observables en la línea de comandos y ejecutables de usuario.
          # No se guardan argumentos de apps; URLs se limpian de query/fragment para evitar tokens.
          try {
              $stateDir = "C:\Datos\.apps"
              New-Item -ItemType Directory -Path $stateDir -Force | Out-Null
              $browserUrls = @()
              $apps = @()
              foreach ($proc in Get-CimInstance Win32_Process -ErrorAction SilentlyContinue) {
                  if (-not $proc.ExecutablePath) { continue }
                  try {
                      $owner = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
                      if ($owner.User -ne 'RDP') { continue }
                  } catch { continue }
                  $exe = $proc.ExecutablePath
                  if ($exe -match '(?i)\\(chrome|msedge|firefox)\.exe$') {
                      $cmd = [string]$proc.CommandLine
                      foreach ($m in [regex]::Matches($cmd, '(?i)https?://[^\s"'']+')) {
                          try {
                              $u = [uri]($m.Value.TrimEnd(')', ',', ';'))
                              $builder = [System.UriBuilder]$u
                              $builder.Query = ''; $builder.Fragment = ''
                              $browserUrls += $builder.Uri.AbsoluteUri
                          } catch { }
                      }
                  } elseif ($exe -notmatch '(?i)\\(conhost|OpenConsole|powershell|pwsh|cmd|explorer|RuntimeBroker|SearchHost|StartMenuExperienceHost|ShellExperienceHost|OneDrive|SecurityHealthSystray)\.exe$') {
                      $apps += $exe
                  }
              }
              $state = [ordered]@{
                  capturedUtc = [DateTime]::UtcNow.ToString('o')
                  browserUrls = @($browserUrls | Sort-Object -Unique)
                  appExecutables = @($apps | Sort-Object -Unique)
              }
              $state | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $stateDir 'session-state.json') -Encoding utf8
          } catch { Write-Host "::warning::No se pudo capturar completamente el estado de sesión." }

          # Sumas de control para poder verificar la copia al restaurarla
          $sums = Get-ChildItem $dst -File | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          }
          $sums | Set-Content "$dst\SHA256SUMS.txt"

          $files = Get-ChildItem $dst -File | ForEach-Object FullName
          if (-not $files) { Write-Host "[backup] Nada que guardar."; exit 0 }
          $gb = [math]::Round(((Get-ChildItem $dst -File | Measure-Object Length -Sum).Sum)/1GB,2)
          Write-Host "[backup] Copia lista: $($files.Count) archivos, $gb GB. Subiendo..."

          $tag = "$prefix$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          gh release create $tag --title $tag --notes "Copia automática del escritorio remoto" --latest=false
          if ($LASTEXITCODE -ne 0) { Write-Host "[backup] No se pudo crear la Release."; exit 1 }

          $upOk = Upload-Retry $tag $files
          if ($upOk) {
              # Verificar que todo lo subido existe y pesa lo mismo que en local
              $remote = gh release view $tag --json assets 2>$null | ConvertFrom-Json
              foreach ($f in Get-ChildItem $dst -File) {
                  $r = $remote.assets | Where-Object { $_.name -eq $f.Name }
                  if (-not $r -or $r.size -ne $f.Length) {
                      Write-Host "[backup] Verificación fallida: $($f.Name)"
                      $upOk = $false
                  }
              }
          }
          if (-not $upOk) {
              Write-Host "[backup] La subida falló: se conserva la copia anterior."
              gh release delete $tag --yes --cleanup-tag
              Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
              exit 1
          }

          "ok" | Set-Content "$dst\complete.flag"
          if (-not (Upload-Retry $tag @("$dst\complete.flag"))) {
              gh release delete $tag --yes --cleanup-tag
              Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
              exit 1
          }

          # Conservar las N copias más recientes (la nueva incluida) y borrar el resto
          $all = gh release list --limit 100 --json tagName,createdAt 2>$null | ConvertFrom-Json |
                 Where-Object { $_.tagName -like "$prefix*" } | Sort-Object createdAt -Descending
          foreach ($o in ($all | Select-Object -Skip $keep)) {
              gh release delete $o.tagName --yes --cleanup-tag
          }

          Set-Content "C:\last-sig.txt" $sig
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "[backup] Copia guardada en la Release $tag (se conservan $keep)."
          exit 0
          '@
          Set-Content -Path "C:\backup.ps1" -Value $script -Encoding utf8

      - name: Record baseline (apps del runner)
        shell: pwsh
        run: |
          Get-ChildItem "C:\ProgramData\chocolatey\lib" -Directory -ErrorAction SilentlyContinue -WarningAction SilentlyContinue |
            ForEach-Object Name | Sort-Object |
            Set-Content "C:\baseline-choco.txt"

          Get-ChildItem "C:\Program Files" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object Name | Sort-Object | Set-Content "C:\baseline-pf.txt"
          Get-ChildItem "C:\Program Files (x86)" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object Name | Sort-Object | Set-Content "C:\baseline-pf86.txt"

          $paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                   'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                   'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          Get-ItemProperty $paths -ErrorAction SilentlyContinue |
            Where-Object DisplayName |
            ForEach-Object DisplayName | Sort-Object -Unique |
            Set-Content "C:\baseline-registry.txt"

          # Líneas base extra: ProgramData, servicios, accesos del menú Inicio y PATH del sistema
          Get-ChildItem "C:\ProgramData" -Directory -Force -ErrorAction SilentlyContinue |
            ForEach-Object Name | Sort-Object | Set-Content "C:\baseline-pd.txt"
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            ForEach-Object Name | Sort-Object | Set-Content "C:\baseline-services.txt"
          $sm = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs"
          Get-ChildItem $sm -Recurse -File -Force -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName.Substring($sm.Length).TrimStart('\') } | Sort-Object |
            Set-Content "C:\baseline-startmenu.txt"
          ([Environment]::GetEnvironmentVariable('Path','Machine') -split ';') | Where-Object { $_ } |
            Sort-Object -Unique | Set-Content "C:\baseline-path.txt"

          # Línea base de winget: paquetes que ya trae el runner (para no guardarlos ni reinstalarlos)
          if (Get-Command winget -ErrorAction SilentlyContinue) {
              $wgb = Join-Path $env:TEMP "winget-base.json"
              Remove-Item $wgb -Force -ErrorAction SilentlyContinue
              winget export -o $wgb --accept-source-agreements 2>&1 | Out-Null
              if (Test-Path $wgb) {
                  try {
                      @((Get-Content $wgb -Raw | ConvertFrom-Json).Sources.Packages.PackageIdentifier) |
                        Where-Object { $_ } | Sort-Object -Unique | Set-Content "C:\baseline-winget.txt"
                  } catch { Write-Host "::warning::No se pudo leer la línea base de winget." }
                  Remove-Item $wgb -Force -ErrorAction SilentlyContinue
              }
          }
          $global:LASTEXITCODE = 0

      - name: Free disk space (en segundo plano)
        if: ${{ inputs.liberar }}
        shell: pwsh
        run: |
          $log = "C:\cleanup.log"
          "Inicio: $([math]::Round((Get-PSDrive C).Free/1GB,1)) GB libres" | Add-Content $log
          # Elimina solo temporales y cachés; conserva aplicaciones y datos del usuario.
          $targets = @("$env:TEMP\*", "C:\Windows\Temp\*")
          foreach ($target in $targets) {
              Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          }
          "Fin: $([math]::Round((Get-PSDrive C).Free/1GB,1)) GB libres" | Add-Content $log
          $global:LASTEXITCODE = 0

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        env:
          # Opcional: si defines el secreto RDP_PASSWORD se usa esa contraseña fija
          # (necesario para que las sesiones cifradas con DPAPI puedan sobrevivir entre ejecuciones).
          # Debe cumplir la complejidad de Windows. Si no existe, se genera una aleatoria.
          RDP_PASSWORD_FIXED: ${{ secrets.RDP_PASSWORD }}
        run: |
          $fixed = $env:RDP_PASSWORD_FIXED
          if ($fixed) {
              Write-Host "::add-mask::$fixed"
              $password = $fixed
              "RDP_PW_FIXED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              $charSet = @{
                  Upper = [char[]](65..90)
                  Lower = [char[]](97..122)
                  Number = [char[]](48..57)
                  Special = ([char[]](33..47) + [char[]](58..64) +
                             [char[]](91..96) + [char[]](123..126))
              }
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

          $out = $env:GITHUB_STEP_SUMMARY
          "## Conexión RDP (generada en este paso)" | Out-File $out -Append -Encoding utf8
          "- Usuario: ``RDP``" | Out-File $out -Append -Encoding utf8
          if ($fixed) {
              "- Contraseña: la que guardaste en el secreto ``RDP_PASSWORD``" | Out-File $out -Append -Encoding utf8
          } else {
              $password | Set-Content -Path "C:\rdp-password.txt" -Encoding utf8 -NoNewline
              Write-Host "::add-mask::$password"
              "- Contraseña generada y guardada en el archivo temporal del runner; no se imprime en el resumen." | Out-File $out -Append -Encoding utf8
          }

          "RDP_PASSWORD_GEN<<RDP_PASSWORD_EOF_7f3a9b2c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $password | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PASSWORD_EOF_7f3a9b2c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download backup and restore D and Datos
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          $7z = "C:\Program Files\7-Zip\7z.exe"
          $dl = "D:\_rdp_dl"
          if (-not (Test-Path "D:\")) { $dl = "C:\_rdp_dl" }
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          "RDP_DL=$dl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Copias completas (con complete.flag), de la más nueva a la más antigua
          $cands = @()
          $all = gh release list --limit 100 --json tagName,createdAt 2>$null | ConvertFrom-Json |
                 Where-Object { $_.tagName -like "$($env:BACKUP_PREFIX)*" } |
                 Sort-Object createdAt -Descending
          foreach ($c in $all) {
              $v = gh release view $c.tagName --json assets 2>$null | ConvertFrom-Json
              if ($v.assets.name -contains "complete.flag") { $cands += $c }
          }

          if ($cands.Count -eq 0) {
              Write-Host "No hay copia previa completa (primera ejecución)."
              "ok" | Set-Content "C:\restore-ok.flag"
              "RESTORE_OK=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue
              $global:LASTEXITCODE = 0
              exit 0
          }

          try {
              $sec = ConvertTo-SecureString $env:RDP_PASSWORD_GEN -AsPlainText -Force
              $cred = New-Object System.Management.Automation.PSCredential("RDP", $sec)
              Start-Process -FilePath "cmd.exe" -ArgumentList "/c exit" -Credential $cred `
                            -WindowStyle Hidden -Wait
              Write-Host "Perfil del usuario RDP pre-creado."
          } catch {
              Write-Host "::warning::No se pudo pre-crear el perfil (se restaurará igualmente): $($_.Exception.Message)"
          }

          $datosRoot = if (Test-Path "D:\") { "D:\" } else { "C:\" }
          $sets = @(
              @{ Vol = "datos.7z.001";   Out = $datosRoot },
              @{ Vol = "profile.7z.001"; Out = "C:\Users\" },
              @{ Vol = "dextra.7z.001";  Out = $datosRoot }
          )

          # Descarga, verifica y extrae una copia. Devuelve $true si todo salió bien.
          function Restore-From($tag) {
              Write-Host "Probando copia: $tag"
              Get-ChildItem $dl -File -ErrorAction SilentlyContinue | Remove-Item -Force
              $got = $false
              for ($i = 1; $i -le 3 -and -not $got; $i++) {
                  gh release download $tag --dir $dl --clobber 2>&1 | Out-Host
                  if ($LASTEXITCODE -eq 0) { $got = $true } else { Write-Host "Intento $i fallido"; Start-Sleep 10 }
              }
              if (-not $got) { return $false }

              Get-ChildItem $dl -File | ForEach-Object { Write-Host (" {0} {1} MB" -f $_.Name, [math]::Round($_.Length/1MB)) }

              $sumFile = Join-Path $dl "SHA256SUMS.txt"
              if (Test-Path $sumFile) {
                  foreach ($line in Get-Content $sumFile) {
                      if ($line -match '^([0-9A-Fa-f]{64})\s+(.+)$') {
                          $f = Join-Path $dl $Matches[2].Trim()
                          if (-not (Test-Path $f) -or (Get-FileHash $f -Algorithm SHA256).Hash -ne $Matches[1]) {
                              Write-Host "::warning::Suma de control incorrecta en $($Matches[2])"
                              return $false
                          }
                      }
                  }
                  Write-Host "Sumas de control verificadas."
              }

              $ok = $true
              foreach ($s in $sets) {
                  $vol = Join-Path $dl $s.Vol
                  if (-not (Test-Path $vol)) { continue }
                  Write-Host "Extrayendo $($s.Vol) -> $($s.Out)"
                  & $7z x $vol "-o$($s.Out)" -y "-p$env:BACKUP_PASSPHRASE" | Out-Null
                  if ($LASTEXITCODE -ge 2) {
                      Write-Host "::warning::Error extrayendo $($s.Vol) (código $LASTEXITCODE)"
                      $ok = $false
                  }
              }
              return $ok
          }

          $restoreOk = $false
          foreach ($c in $cands) {
              if (Restore-From $c.tagName) {
                  $restoreOk = $true
                  Write-Host "Copia restaurada: $($c.tagName)"
                  "RESTORED_TAG=$($c.tagName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  break
              }
              Write-Host "::warning::La copia $($c.tagName) no se pudo restaurar; se prueba la anterior."
          }
          if (-not $restoreOk) {
              Write-Host "::warning::No se pudo restaurar ninguna copia. Esta sesión NO guardará copias para no pisar las anteriores."
              Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue
              "RESTORE_OK=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $global:LASTEXITCODE = 0
              exit 0
          }

          $datosDir = if (Test-Path "D:\") { "D:\Datos" } else { "C:\Datos" }
          if (-not (Test-Path $datosDir)) {
              Write-Host "::warning::No apareció $datosDir tras extraer la copia."
              $restoreOk = $false
          }

          $prog = "C:\Datos\.programas"
          if ($restoreOk -and (Test-Path $prog)) {
              foreach ($m in @(
                  @{ S = "$prog\PF";    D = "C:\Program Files" },
                  @{ S = "$prog\PF86";  D = "C:\Program Files (x86)" },
                  @{ S = "$prog\PD";    D = "C:\ProgramData" },
                  @{ S = "$prog\Local"; D = "C:\Users\RDP\AppData\Local\Programs" }
              )) {
                  if (Test-Path $m.S) {
                      Write-Host "Restaurando programas: $($m.S) -> $($m.D)"
                      robocopy $m.S $m.D /E /COPY:DAT /DCOPY:T /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
                      $global:LASTEXITCODE = 0
                  }
              }
          }

          $appsDir = "C:\Datos\.apps"
          $rep = New-Object System.Collections.Generic.List[string]

          # --- Registro de apps (HKLM), PATH, servicios y accesos directos ---
          if ($restoreOk) {
              $hk = Join-Path $appsDir "hklm"
              if (Test-Path $hk) {
                  $imp = 0; $bad = 0
                  foreach ($rf in Get-ChildItem $hk -Filter *.reg -ErrorAction SilentlyContinue) {
                      reg import $rf.FullName 2>&1 | Out-Null
                      if ($LASTEXITCODE -eq 0) { $imp++ } else { $bad++; Write-Host "::warning::No se pudo importar $($rf.Name)" }
                  }
                  Write-Host "Claves HKLM de apps importadas: $imp (fallidas: $bad)"
              }

              $pe = Join-Path $appsDir "path-extra.txt"
              if (Test-Path $pe) {
                  $curL = @([Environment]::GetEnvironmentVariable('Path','Machine') -split ';' | Where-Object { $_ })
                  $add = @(Get-Content $pe | Where-Object { $_ -and $_ -notin $curL })
                  if ($add.Count) {
                      [Environment]::SetEnvironmentVariable('Path', (($curL + $add) -join ';'), 'Machine')
                      Write-Host "PATH del sistema ampliado con $($add.Count) entradas."
                  }
              }

              $sj = Join-Path $appsDir "services.json"
              if (Test-Path $sj) {
                  foreach ($s in @(Get-Content $sj -Raw | ConvertFrom-Json)) {
                      if (-not $s.Name) { continue }
                      if (Get-Service -Name $s.Name -ErrorAction SilentlyContinue) { continue }
                      try {
                          $mode = switch ($s.StartMode) { 'Auto' { 'Automatic' } 'Disabled' { 'Disabled' } default { 'Manual' } }
                          $disp = if ($s.DisplayName) { $s.DisplayName } else { $s.Name }
                          New-Service -Name $s.Name -BinaryPathName $s.PathName -DisplayName $disp -StartupType $mode -ErrorAction Stop | Out-Null
                          if ($mode -eq 'Automatic') { Start-Service -Name $s.Name -ErrorAction SilentlyContinue }
                          Write-Host "Servicio recreado: $($s.Name)"
                      } catch {
                          Write-Host "::warning::No se pudo recrear el servicio $($s.Name): $($_.Exception.Message)"
                          $rep.Add("Servicio no recreado: $($s.Name)")
                      }
                  }
              }

              $smSrc = Join-Path $appsDir "startmenu"
              if (Test-Path $smSrc) {
                  robocopy $smSrc "C:\ProgramData\Microsoft\Windows\Start Menu\Programs" /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
              }
              $pdSrc = Join-Path $appsDir "publicdesktop"
              if (Test-Path $pdSrc) {
                  robocopy $pdSrc "C:\Users\Public\Desktop" /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
              }
              $global:LASTEXITCODE = 0
          }

          # --- Chocolatey: instala con log, reintento y resumen de fallos ---
          function Install-Choco($p) {
              for ($i = 1; $i -le 2; $i++) {
                  $o = choco install $p -y --no-progress --limit-output 2>&1
                  $ec = $LASTEXITCODE
                  if ($ec -in 0, 1641, 3010) { return $true }
                  Write-Host "::warning::choco install $p falló (código $ec, intento $i)"
                  $o | Select-Object -Last 8 | ForEach-Object { Write-Host "    $_" }
                  Start-Sleep 5
              }
              return $false
          }

          $chocoList = "C:\Datos\.apps\choco-packages.txt"
          if ($restoreOk) {
              # Lista fija: se ignora lo que traiga la copia antigua (choco y winget)
              New-Item -ItemType Directory -Path "C:\Datos\.apps" -Force | Out-Null
              @($env:APPS_FIJAS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }) | Set-Content $chocoList
              Remove-Item "C:\Datos\.apps\winget-packages.json" -Force -ErrorAction SilentlyContinue
          }
          if ($restoreOk -and (Test-Path $chocoList)) {
              if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
                  Write-Host "::warning::choco no está disponible en este runner: no se reinstalan los paquetes."
                  $rep.Add("choco no disponible: paquetes sin reinstalar")
              } else {
                  $pkgs = @(Get-Content $chocoList -ErrorAction SilentlyContinue | Where-Object { $_ -and $_.Trim() })
                  # Omitir los que el runner ya trae (línea base tomada antes de restaurar) o que ya están instalados
                  $chocoBase = @()
                  if (Test-Path "C:\baseline-choco.txt") { $chocoBase = @(Get-Content "C:\baseline-choco.txt" | Where-Object { $_ }) }
                  $skipped = @($pkgs | Where-Object { $_ -in $chocoBase -or (Test-Path "C:\ProgramData\chocolatey\lib\$_") })
                  if ($skipped.Count) { Write-Host "Chocolatey: se omiten $($skipped.Count) paquetes ya presentes en el runner: $($skipped -join ', ')" }
                  $pkgs = @($pkgs | Where-Object { $_ -notin $skipped })
                  Write-Host "Reinstalando $($pkgs.Count) paquetes de Chocolatey..."
                  $okN = 0
                  foreach ($p in $pkgs) {
                      Write-Host "choco install $p"
                      if (Install-Choco $p) { $okN++ } else { $rep.Add("choco falló: $p") }
                  }
                  Write-Host "Chocolatey: $okN de $($pkgs.Count) paquetes correctos."
                  $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
              }
              $global:LASTEXITCODE = 0
          }

          # --- winget: si no existe en el runner, se intenta instalarlo (best-effort) ---
          $wingetJson = "C:\Datos\.apps\winget-packages.json"
          # Filtrar la lista guardada: fuera lo que el runner ya trae (también copias antiguas con la lista completa)
          if ($restoreOk -and (Test-Path $wingetJson) -and (Test-Path "C:\baseline-winget.txt")) {
              try {
                  $wgBaseR = @(Get-Content "C:\baseline-winget.txt" | Where-Object { $_ })
                  $wgR = Get-Content $wingetJson -Raw | ConvertFrom-Json
                  foreach ($src in @($wgR.Sources)) {
                      $src.Packages = @($src.Packages | Where-Object { $_.PackageIdentifier -notin $wgBaseR })
                  }
                  $wgR.Sources = @($wgR.Sources | Where-Object { $_.Packages.Count -gt 0 })
                  $wgR | ConvertTo-Json -Depth 8 | Set-Content $wingetJson -Encoding utf8
              } catch { Write-Host "::warning::No se pudo filtrar la lista de winget: $($_.Exception.Message)" }
          }
          $wgPending = 0
          if (Test-Path $wingetJson) {
              try { $wgPending = @((Get-Content $wingetJson -Raw | ConvertFrom-Json).Sources.Packages).Count } catch { $wgPending = 1 }
          }
          if ($restoreOk -and (Test-Path $wingetJson) -and $wgPending -eq 0) {
              Write-Host "winget: no hay paquetes propios que reinstalar (todo lo guardado ya viene en el runner)."
          }
          if ($restoreOk -and (Test-Path $wingetJson) -and $wgPending -gt 0) {
              Write-Host "winget: reinstalando $wgPending paquetes propios."
              if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
                  Write-Host "winget no está en el runner: intentando instalarlo..."
                  try {
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Install-PackageProvider NuGet -Force | Out-Null; Install-Module Microsoft.WinGet.Client -Force -Scope AllUsers -Repository PSGallery | Out-Null; Import-Module Microsoft.WinGet.Client; Repair-WinGetPackageManager -AllUsers" 2>&1 | Out-Host
                  } catch { Write-Host "::warning::Fallo al preparar winget: $($_.Exception.Message)" }
                  $env:Path += ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
              }
              if (Get-Command winget -ErrorAction SilentlyContinue) {
                  Write-Host "Reinstalando paquetes winget..."
                  winget import -i $wingetJson --accept-package-agreements --accept-source-agreements --ignore-versions --disable-interactivity 2>&1 | Out-Host
                  if ($LASTEXITCODE -ne 0) {
                      Write-Host "::warning::winget import terminó con código $LASTEXITCODE"
                      $rep.Add("winget import con errores (código $LASTEXITCODE)")
                  }
              } else {
                  Write-Host "::warning::winget no está disponible: no se reinstalan los paquetes de winget."
                  $rep.Add("winget no disponible: paquetes sin reinstalar")
              }
              $global:LASTEXITCODE = 0
          }

          # --- Mostrar qué apps hay en las listas de choco y winget guardadas ---
          if ($restoreOk) {
              $o = $env:GITHUB_STEP_SUMMARY
              "## Apps en las listas de reinstalación" | Out-File $o -Append -Encoding utf8
              $cl = "C:\Datos\.apps\choco-packages.txt"
              $cItems = @()
              if (Test-Path $cl) { $cItems = @(Get-Content $cl | Where-Object { $_ -and $_.Trim() }) }
              "### Chocolatey ($($cItems.Count))" | Out-File $o -Append -Encoding utf8
              $cItems | ForEach-Object { "- $_" | Out-File $o -Append -Encoding utf8 }
              Write-Host "Chocolatey guardados ($($cItems.Count)): $($cItems -join ', ')"
              $wItems = @()
              if (Test-Path $wingetJson) {
                  try { $wItems = @((Get-Content $wingetJson -Raw | ConvertFrom-Json).Sources.Packages.PackageIdentifier) } catch { }
              }
              "### winget ($($wItems.Count))" | Out-File $o -Append -Encoding utf8
              $wItems | ForEach-Object { "- $_" | Out-File $o -Append -Encoding utf8 }
              Write-Host "winget guardados ($($wItems.Count)): $($wItems -join ', ')"
          }

          # --- Informe: apps guardadas que siguen sin aparecer como instaladas ---
          $listFile = "C:\Datos\.apps\programas-instalados.txt"
          if ($restoreOk -and (Test-Path $listFile)) {
              $uPaths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                        'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
              $nowNames = @(Get-ItemProperty $uPaths -ErrorAction SilentlyContinue | Where-Object DisplayName | ForEach-Object DisplayName)
              $userReg = ""
              $ur = "C:\Datos\.apps\registry\rdp-software.reg"
              if (Test-Path $ur) { $userReg = [IO.File]::ReadAllText($ur, [Text.Encoding]::Unicode) }
              $saved = @(Get-Content $listFile | Where-Object { $_ })
              $missing = @($saved | Where-Object { $_ -notin $nowNames -and -not $userReg.Contains($_) })
              $out = $env:GITHUB_STEP_SUMMARY
              "## Restauración de apps" | Out-File $out -Append -Encoding utf8
              "- Apps guardadas: $($saved.Count); registradas tras restaurar: $($saved.Count - $missing.Count)" | Out-File $out -Append -Encoding utf8
              if ($missing.Count) {
                  "- **Sin registrar** (reinstálalas; si usas choco quedarán guardadas):" | Out-File $out -Append -Encoding utf8
                  $missing | ForEach-Object { "  - $_" | Out-File $out -Append -Encoding utf8; Write-Host "::warning::App sin restaurar: $_" }
              }
              $rep | ForEach-Object { "- $_" | Out-File $out -Append -Encoding utf8 }
          }

          # Aviso sobre sesiones cifradas (DPAPI): solo pueden funcionar si el SID del usuario RDP no ha cambiado
          $sidFile = "C:\Datos\.apps\registry\rdp-sid.txt"
          if ($restoreOk -and (Test-Path $sidFile)) {
              $oldSid = (Get-Content $sidFile -Raw).Trim()
              $newSid = (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue).SID.Value
              if ($oldSid -ne $newSid) {
                  Write-Host "::warning::El SID del usuario RDP cambió ($oldSid -> $newSid): las sesiones guardadas con DPAPI (Chrome, Edge, credenciales de Windows) no se podrán descifrar."
              } else {
                  Write-Host "El SID del usuario RDP es el mismo que en la copia anterior."
              }
              if ($env:RDP_PW_FIXED -ne "1") {
                  Write-Host "::notice::Contraseña aleatoria en cada ejecución: las sesiones guardadas con DPAPI no se descifrarán. Define el secreto RDP_PASSWORD para usar una fija."
              }
          }

          # Configuración del usuario RDP (programas, imagen de fondo, colores):
          # se carga su NTUSER.DAT y se importan todos los .reg guardados
          $regDir = "C:\Datos\.apps\registry"
          $nt = "C:\Users\RDP\NTUSER.DAT"
          if ($restoreOk -and (Test-Path $regDir)) {
              if (Test-Path $nt) {
                  Write-Host "Restaurando configuración del usuario RDP..."
                  reg load HKU\RDP_RESTORE $nt 2>$null | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                      foreach ($rf in Get-ChildItem $regDir -Filter *.reg -ErrorAction SilentlyContinue) {
                          reg import $rf.FullName 2>$null | Out-Null
                          Write-Host "Importado $($rf.Name) (código $LASTEXITCODE)."
                      }
                      [gc]::Collect(); Start-Sleep 2
                      reg unload HKU\RDP_RESTORE 2>$null | Out-Null
                  } else {
                      Write-Host "::warning::No se pudo cargar el perfil del usuario RDP; la configuración no se restauró."
                  }
              } else {
                  Write-Host "::warning::No existe NTUSER.DAT del usuario RDP; la configuración no se restauró."
              }
              $global:LASTEXITCODE = 0
          }

          # Preparar restauración del estado al iniciar sesión RDP, dentro del escritorio interactivo.
          if ($restoreOk) {
              $stateFile = "C:\Datos\.apps\session-state.json"
              if (Test-Path $stateFile) {
                  $startup = "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
                  New-Item -ItemType Directory -Path $startup -Force | Out-Null
                  $restoreScript = Join-Path $startup "RDP-Restore-Session.ps1"
                  @'
          $ErrorActionPreference = 'SilentlyContinue'
          $stateFile = 'C:\Datos\.apps\session-state.json'
          if (-not (Test-Path $stateFile)) { exit 0 }
          $state = Get-Content $stateFile -Raw | ConvertFrom-Json
          foreach ($exe in @($state.appExecutables)) {
              if ($exe -and (Test-Path $exe) -and $exe -notmatch '(?i)\\(chrome|msedge|firefox)\.exe$') {
                  Start-Process -FilePath $exe
              }
          }
          $urls = @($state.browserUrls | Where-Object { $_ -match '^https?://' })
          $chrome = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          $edge = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          $browser = if ($edge) { $edge } else { $chrome }
          if ($browser) {
              if ($urls.Count) { Start-Process -FilePath $browser -ArgumentList $urls }
              else { Start-Process -FilePath $browser }
          }
          Remove-Item $PSCommandPath -Force -ErrorAction SilentlyContinue
          '@ | Set-Content -LiteralPath $restoreScript -Encoding utf8
                  $ntHive = 'C:\Users\RDP\NTUSER.DAT'
                  if (Test-Path $ntHive) {
                      reg load HKU\RDP_RESTORE $ntHive 2>$null | Out-Null
                      if ($LASTEXITCODE -eq 0) {
                          $runKey = 'Registry::HKEY_USERS\RDP_RESTORE\Software\Microsoft\Windows\CurrentVersion\RunOnce'
                          New-Item -Path $runKey -Force | Out-Null
                          Set-ItemProperty -Path $runKey -Name 'RDP-Restore-Session' -Value ('powershell.exe -NoProfile -ExecutionPolicy Bypass -File "' + $restoreScript + '"')
                          [gc]::Collect(); Start-Sleep 1
                          reg unload HKU\RDP_RESTORE 2>$null | Out-Null
                      } else {
                          Write-Host '::warning::No se pudo registrar el inicio automático de la restauración de sesión.'
                      }
                  }              }
          }

          if ($restoreOk) {
              "ok" | Set-Content "C:\restore-ok.flag"
              "RESTORE_OK=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Restauración completada."
          } else {
              "RESTORE_OK=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "::warning::Restauración incompleta: esta sesión NO hará copias para no pisar la anterior."
          }

          Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

      - name: Install Sunshine (streaming para Moonlight)
        if: ${{ inputs.sunshine }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sunDir = "C:\Program Files\Sunshine"
          $sunExe = Join-Path $sunDir "sunshine.exe"

          # 1) Buscar el instalador AMD64 (.msi preferido, .exe como alternativa) en las últimas releases
          try {
              $rels = Invoke-RestMethod "https://api.github.com/repos/LizardByte/Sunshine/releases?per_page=15" `
                          -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "gha-rdp" }
              $asset = $null; $tag = ""
              foreach ($pre in @($false, $true)) {
                  foreach ($r in ($rels | Where-Object { -not $_.draft -and ($_.prerelease -eq $pre) })) {
                      $cand = $r.assets |
                              Where-Object { $_.name -match '^Sunshine-Windows-AMD64-installer\.(msi|exe)$' } |
                              Sort-Object { $_.name -notlike '*.msi' } | Select-Object -First 1
                      if ($cand) { $asset = $cand; $tag = $r.tag_name; break }
                  }
                  if ($asset) { break }
              }
              if (-not $asset) {
                  Write-Host "Assets de la release más reciente: $(($rels[0].assets.name) -join ', ')"
                  throw "No se encontró el instalador de Windows AMD64 en las últimas releases."
              }

              $file = Join-Path $env:RUNNER_TEMP $asset.name
              Write-Host "Descargando $($asset.name) ($tag)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $file -UseBasicParsing -TimeoutSec 300
              if ($asset.name -like '*.msi') {
                  $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$file`"", "/qn", "/norestart" -Wait -PassThru
              } else {
                  $p = Start-Process $file -ArgumentList "/S" -Wait -PassThru
              }
              Write-Host "Instalación de Sunshine: exit $($p.ExitCode)"
          } catch {
              Write-Host "::warning::No se pudo instalar Sunshine: $($_.Exception.Message)"
          }

          # Localizar sunshine.exe si no está en la ruta habitual
          if (-not (Test-Path $sunExe)) {
              $found = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter sunshine.exe -ErrorAction SilentlyContinue |
                       Select-Object -First 1
              if ($found) { $sunExe = $found.FullName; $sunDir = $found.DirectoryName }
          }

          if (-not (Test-Path $sunExe)) {
              Write-Host "::warning::sunshine.exe no encontrado: se omite Sunshine."
              "SUNSHINE_OK=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $global:LASTEXITCODE = 0
              exit 0
          }

          # 2) Parar el servicio y restaurar la configuración guardada (móviles ya emparejados)
          $svc = (Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*unshine*' } | Select-Object -First 1).Name
          Write-Host "Servicio de Sunshine: $svc"
          if ($svc) { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue }
          $saved = "C:\Datos\.apps\sunshine-config"
          if (Test-Path $saved) {
              Write-Host "Restaurando configuración de Sunshine..."
              robocopy $saved (Join-Path $sunDir "config") /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
              $global:LASTEXITCODE = 0
          }

          # 3) Credenciales nuevas para la web de administración (solo alfanuméricas)
          $pw = -join (((48..57) + (65..90) + (97..122)) | Get-Random -Count 16 | ForEach-Object { [char]$_ })
          Write-Host "::add-mask::$pw"
          Push-Location $sunDir
          & $sunExe --creds sunshine $pw 2>&1 | Write-Host
          Pop-Location
          "SUNSHINE_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SUNSHINE_OK=1"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 4) Firewall: quitar reglas abiertas del instalador y permitir solo Tailscale
          netsh advfirewall firewall delete rule name="Sunshine" | Out-Null
          netsh advfirewall firewall delete rule name="Sunshine-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="Sunshine-Tailscale" `
            dir=in action=allow protocol=any program="$sunExe" remoteip=100.64.0.0/10 | Out-Null

          # 5) Arrancar y mostrar diagnóstico
          if ($svc) { Start-Service -Name $svc -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 8
          if ($svc) { Get-Service $svc -ErrorAction SilentlyContinue | Format-Table Name, Status | Out-String | Write-Host }
          $log = Join-Path $sunDir "config\sunshine.log"
          if (Test-Path $log) {
              Write-Host "===== sunshine.log (últimas 40 líneas) ====="
              Get-Content $log -Tail 40 | Write-Host
          }
          $global:LASTEXITCODE = 0

      - name: Set up Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ip = ""
          if (-not $env:TS_AUTHKEY) {
              Write-Host "::warning::Falta el secreto TS_AUTHKEY: la regla de firewall solo permite 100.64.0.0/10 (Tailscale), así que el puerto 3389 quedará inaccesible."
          } else {
              Write-Host "::add-mask::$env:TS_AUTHKEY"
              $msi = Join-Path $env:RUNNER_TEMP "tailscale.msi"
              try {
                  Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
                                    -OutFile $msi -UseBasicParsing -TimeoutSec 120
                  $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart" -Wait -PassThru
                  Write-Host "Instalación de Tailscale: exit $($p.ExitCode)"
              } catch {
                  Write-Host "::warning::No se pudo instalar Tailscale: $($_.Exception.Message)"
              }

              $ts = "C:\Program Files\Tailscale\tailscale.exe"
              for ($i = 0; $i -lt 15 -and -not (Test-Path $ts); $i++) { Start-Sleep 2 }

              if (Test-Path $ts) {
                  $tsHost = "rdp-$($env:GITHUB_RUN_ID)"
                  $up = $false
                  for ($i = 1; $i -le 6 -and -not $up; $i++) {
                      & $ts up --auth-key="$env:TS_AUTHKEY" --hostname=$tsHost 2>&1 | Write-Host
                      if ($LASTEXITCODE -eq 0) { $up = $true } else { Start-Sleep 8 }
                  }
                  if ($up) {
                      $ip = ((& $ts ip -4) | Select-Object -First 1)
                      if ($ip) { $ip = $ip.Trim() }
                      Write-Host "Tailscale conectado. IP: $ip"
                  } else {
                      Write-Host "::warning::'tailscale up' falló: RDP no será alcanzable."
                  }
              } else {
                  Write-Host "::warning::tailscale.exe no encontrado tras la instalación."
              }
          }

          "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: Show connection info
        if: ${{ always() }}
        shell: pwsh
        run: |
          $out = $env:GITHUB_STEP_SUMMARY
          $pw = $env:RDP_PASSWORD_GEN
          if (-not $pw -and (Test-Path "C:\rdp-password.txt")) {
              $pw = (Get-Content "C:\rdp-password.txt" -Raw).Trim()
          }
          if ($pw) { Write-Host "::add-mask::$pw" }

          "## Conexión RDP" | Out-File $out -Append -Encoding utf8
          if ($env:TS_IP) {
              "- Host: ``$($env:TS_IP)`` (red de Tailscale; instala Tailscale en tu equipo y únete a la misma red)" |
                Out-File $out -Append -Encoding utf8
          } else {
              "- Host: **no disponible** (falta ``TS_AUTHKEY``; la regla de firewall solo permite Tailscale)" |
                Out-File $out -Append -Encoding utf8
          }
          "- Puerto: ``3389`` (RDP con NLA)" | Out-File $out -Append -Encoding utf8
          "- Usuario: ``RDP``" | Out-File $out -Append -Encoding utf8
          "- Contraseña:" | Out-File $out -Append -Encoding utf8
          if ($env:RDP_PW_FIXED -eq "1") {
              "La que guardaste en el secreto ``RDP_PASSWORD``." | Out-File $out -Append -Encoding utf8
          } elseif ($pw) {
              '````' | Out-File $out -Append -Encoding utf8
              $pw | Out-File $out -Append -Encoding utf8
              '````' | Out-File $out -Append -Encoding utf8
          } else {
              "(no disponible)" | Out-File $out -Append -Encoding utf8
          }
          "- La sesión termina sola al llegar al plazo: conecta cuanto antes." |
            Out-File $out -Append -Encoding utf8

          if ($env:SUNSHINE_OK -eq "1") {
              "`n## Conexión desde el móvil (Sunshine + Moonlight)" | Out-File $out -Append -Encoding utf8
              if ($env:TS_IP) {
                  "- En el móvil: instala **Tailscale** (misma cuenta/red) y **Moonlight**." | Out-File $out -Append -Encoding utf8
                  "- Moonlight → añadir equipo manualmente → IP ``$($env:TS_IP)``." | Out-File $out -Append -Encoding utf8
                  "- Moonlight mostrará un PIN: introdúcelo en ``https://$($env:TS_IP):47990/pin`` (acepta el aviso del certificado)." | Out-File $out -Append -Encoding utf8
                  "- Web de administración: ``https://$($env:TS_IP):47990``" | Out-File $out -Append -Encoding utf8
              } else {
                  "- Sin IP de Tailscale no hay forma de llegar a Sunshine." | Out-File $out -Append -Encoding utf8
              }
              "- Usuario web: ``sunshine``" | Out-File $out -Append -Encoding utf8
              "- Contraseña web:" | Out-File $out -Append -Encoding utf8
              if ($env:SUNSHINE_PW) { Write-Host "::add-mask::$($env:SUNSHINE_PW)" }
              "Contraseña generada para esta ejecución; no se imprime en logs ni en el resumen." | Out-File $out -Append -Encoding utf8
              "- Si usas Moonlight, no tengas a la vez una sesión RDP abierta: Sunshine no puede capturar sesiones RDP." |
                Out-File $out -Append -Encoding utf8
          }

          Write-Host "Datos de conexión escritos en el resumen del paso."

      - name: RDP session (periodic backups)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTOS: ${{ inputs.minutos }}
          INTERVALO: ${{ inputs.intervalo }}
          KEEP: ${{ inputs.conservar }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          $start = Get-Date

          $min = 0; [void][int]::TryParse("$env:MINUTOS", [ref]$min)
          if ($min -lt 1)  { $min = 1 }
          if ($min -gt 315) { $min = 315 }

          $interval = 0; [void][int]::TryParse("$env:INTERVALO", [ref]$interval)
          if ($interval -lt 1)  { $interval = 1 }
          if ($interval -gt 315) { $interval = 315 }

          $jobStart = $start.AddMinutes(-20)
          if ($env:JOB_START) {
              try { $jobStart = [datetime]::Parse($env:JOB_START) } catch { }
          }
          $candidate = $start.AddMinutes($min)
          $limit = $jobStart.AddMinutes(350)
          $deadline = if ($candidate -lt $limit) { $candidate } else { $limit }

          Write-Host ("Sesión: {0} min o hasta {1:HH:mm:ss} (lo que llegue antes); copia cada {2} min." -f `
                      $min, $deadline, $interval)

          function Invoke-Backup {
              Write-Host ("{0:HH:mm:ss} Ejecutando copia de seguridad..." -f (Get-Date))
              & pwsh -NoProfile -ExecutionPolicy Bypass -File "C:\backup.ps1" | Out-Host
              $ec = $LASTEXITCODE
              if ($null -eq $ec) { $ec = 0 }
              return [int]$ec
          }

          $lastBackup = $start
          $parado = $false
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 60
              if (Test-Path "C:\Datos\parar.txt") {
                  Remove-Item "C:\Datos\parar.txt" -Force -ErrorAction SilentlyContinue
                  Write-Host "parar.txt detectado: se corta la espera."
                  $parado = $true
                  break
              }
              if (((Get-Date) - $lastBackup).TotalMinutes -ge $interval -and (Get-Date) -lt $deadline) {
                  $code = Invoke-Backup
                  $lastBackup = Get-Date
                  if ($code -ne 0) {
                      Write-Host "::warning::Copia periódica falló (código $code); se reintenta en el próximo intervalo."
                  }
              }
          }
          if (-not $parado) { Write-Host "Plazo cumplido." }

          Write-Host "== Copia final =="
          $code = Invoke-Backup
          if ($code -ne 0) {
              Write-Host "::error::La copia final falló (código $code); se conserva la copia anterior."
              exit 1
          }
          "ok" | Set-Content "C:\final-done.flag"

      - name: Copia de emergencia (si se cancela o falla la sesión)
        if: ${{ cancelled() || failure() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.conservar }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if (Test-Path "C:\final-done.flag") { Write-Host "La copia final ya se había hecho."; exit 0 }
          if (-not (Test-Path "C:\backup.ps1")) { Write-Host "No hay script de copia."; exit 0 }
          Write-Host "Ejecutando copia de emergencia..."
          & pwsh -NoProfile -ExecutionPolicy Bypass -File "C:\backup.ps1"
          if ($LASTEXITCODE -eq 0) { "ok" | Set-Content "C:\final-done.flag" }
          exit 0

      - name: Final summary
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = $env:GITHUB_STEP_SUMMARY

          "## Estado final" | Out-File $out -Append -Encoding utf8
          $rok = if ($env:RESTORE_OK) { $env:RESTORE_OK } else { "?" }
          "- Restauración correcta: $rok" | Out-File $out -Append -Encoding utf8
          if ($env:RESTORED_TAG) { "- Copia restaurada: $($env:RESTORED_TAG)" | Out-File $out -Append -Encoding utf8 }
          $fin = if (Test-Path "C:\final-done.flag") { "sí" } else { "no" }
          "- Copia final guardada: $fin" | Out-File $out -Append -Encoding utf8
          $tip = if ($env:TS_IP) { $env:TS_IP } else { "no disponible" }
          "- IP Tailscale: $tip" | Out-File $out -Append -Encoding utf8

          "`n### Espacio libre" | Out-File $out -Append -Encoding utf8
          Get-PSDrive -Name C,D -ErrorAction SilentlyContinue | ForEach-Object {
              "- $($_.Name): $([math]::Round($_.Free/1GB,1)) GB libres" |
                Out-File $out -Append -Encoding utf8
          }

          "`n### Copias de seguridad" | Out-File $out -Append -Encoding utf8
          try {
              $rels = gh release list --limit 10 --json tagName,createdAt 2>$null | ConvertFrom-Json |
                      Where-Object { $_.tagName -like "$($env:BACKUP_PREFIX)*" }
              if ($rels) {
                  $rels | ForEach-Object {
                      "- $($_.tagName) ($($_.createdAt))" | Out-File $out -Append -Encoding utf8
                  }
              } else {
                  "- Ninguna copia en esta ejecución (sin cambios o restauración fallida)." |
                    Out-File $out -Append -Encoding utf8
              }
          } catch {
              "- No se pudo listar las copias." | Out-File $out -Append -Encoding utf8
          }

          $global:LASTEXITCODE = 0
